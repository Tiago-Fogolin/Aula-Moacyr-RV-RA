<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebXR + Three.js + TypeScript</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #101015; }
      #app { position: fixed; inset: 0; }
      #info {
        position: fixed;
        top: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }
      #sonda {
        position: fixed;
        z-index: 2;
        top: 12px;
        right: 12px;
        width: min(520px, calc(100% - 24px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 12px;
        color: #111;
        background: rgba(255, 255, 255, 0.94);
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #sonda button {
        margin-bottom: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
      #sonda h2, #sonda h3 { margin: 8px 0; }
      #sonda p { margin: 6px 0; }
      #sonda table {
        width: 100%;
        margin: 8px 0;
        border-collapse: collapse;
        font-size: 12px;
      }
      #sonda th, #sonda td {
        padding: 5px;
        border: 1px solid #bbb;
        text-align: left;
        vertical-align: top;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info">Clique em <b>ENTER VR</b> ou <b>START AR</b>. No desktop, arraste para orbitar.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

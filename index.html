<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Ordenha — WebXR + Three.js + TypeScript</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #101015; }
      #app { position: fixed; inset: 0; }
      #info {
        position: fixed;
        top: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      }
      .painel-flutuante {
        position: fixed;
        z-index: 2;
        top: 12px;
        width: min(420px, calc(50% - 18px));
        max-height: calc(100vh - 24px);
        overflow: auto;
        padding: 12px;
        color: #111;
        background: rgba(255, 255, 255, 0.94);
        font-family: system-ui, sans-serif;
        font-size: 13px;
      }
      #painel-relatorio { left: 12px; }
      #sonda { right: 12px; }
      .painel-flutuante button {
        margin-bottom: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .painel-flutuante h1 { font-size: 16px; margin: 0 0 8px; }
      .painel-flutuante h2, .painel-flutuante h3 { margin: 8px 0; }
      .painel-flutuante p { margin: 6px 0; }
      .painel-flutuante pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: #f2f2f2;
        padding: 8px;
        border-radius: 4px;
      }
      .painel-flutuante table {
        width: 100%;
        margin: 8px 0;
        border-collapse: collapse;
        font-size: 12px;
      }
      .painel-flutuante th, .painel-flutuante td {
        padding: 5px;
        border: 1px solid #bbb;
        text-align: left;
        vertical-align: top;
      }
      .diario p { margin: 4px 0; padding: 4px 6px; border-radius: 3px; font-size: 12px; }
      .diario-nota { background: #eef6ff; }
      .diario-alerta { background: #fff4d6; }
      .diario-falha { background: #ffe1e1; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info">Clique em <b>ENTER VR</b> ou <b>START AR</b>. No desktop, clique numa teta pra ordenhar.</div>

    <div id="painel-relatorio" class="painel-flutuante">
      <h1>Cena de ordenha — grafo e laço de renderização</h1>
      <section id="relatorio"></section>
      <section id="estrutura"></section>
      <button id="reparentar-painel" type="button">Mover o painel para o balde</button>
      <div id="diario" class="diario"></div>
    </div>

    <div id="sonda" class="painel-flutuante">
      <button id="sondar" type="button">Sondar aparelho</button>
      <div id="sonda-saida"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
